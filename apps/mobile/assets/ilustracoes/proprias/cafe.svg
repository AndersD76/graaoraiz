      <stop offset="0" stop-color="#FF8A78"/>
      <stop offset="0.45" stop-color="#E0312E"/>
      <stop offset="1" stop-color="#8A1020"/>
    </radialGradient>
    <radialGradient id="fruto2" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#FF9A6A"/>
