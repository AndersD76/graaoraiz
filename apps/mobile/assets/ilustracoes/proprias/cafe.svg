    <linearGradient id="folha2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AAE48"/>
      <stop offset="1" stop-color="#1E5A24"/>
    </linearGradient>
    <g id="lamina">
