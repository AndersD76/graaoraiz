  <g transform="translate(78 196) rotate(112)"><use href="#lamina" fill="url(#folha)" transform="scale(0.8)"/><path d="M6 0 L 80 0" stroke="#BFE7A8" stroke-width="3" opacity="0.7"/></g>

  <!-- frutos (cereja do café) -->
