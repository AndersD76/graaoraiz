    <circle cx="150" cy="108" r="21" fill="url(#fruto2)"/>
    <circle cx="112" cy="130" r="24" fill="url(#fruto)"/>
    <circle cx="150" cy="148" r="23" fill="url(#fruto)"/>
    <circle cx="104" cy="174" r="22" fill="url(#fruto2)"/>
    <circle cx="140" cy="186" r="21" fill="url(#fruto)"/>
