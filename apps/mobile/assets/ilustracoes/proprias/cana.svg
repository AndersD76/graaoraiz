<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="colmo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#EEF2A2"/>
      <stop offset="0.35" stop-color="#C9D964"/>
      <stop offset="0.75" stop-color="#93B23A"/>
      <stop offset="1" stop-color="#6A8A24"/>
    </linearGradient>
    <linearGradient id="no" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#B9B25A"/>
      <stop offset="1" stop-color="#5C6B1C"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BE06A"/>
      <stop offset="1" stop-color="#3B8A2C"/>
    </linearGradient>
    <linearGradient id="folha2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CD45C"/>
      <stop offset="1" stop-color="#2F7A27"/>
    </linearGradient>
    <g id="nos">
      <rect x="-17" y="0" width="34" height="8" rx="4" fill="url(#no)"/>
      <rect x="-12" y="9" width="22" height="3" rx="1.5" fill="#F7F9D2" opacity="0.75"/>
    </g>
  </defs>

  <!-- folhas de trás -->
  <path d="M96 78 C 80 44, 52 28, 18 30 C 50 40, 74 58, 88 86 Z" fill="url(#folha2)"/>
  <path d="M168 84 C 184 50, 212 34, 246 38 C 214 46, 190 64, 176 92 Z" fill="url(#folha)"/>

  <!-- colmo esquerdo -->
  <g transform="translate(94 86) rotate(-8)">
    <rect x="-15" y="0" width="30" height="158" rx="13" fill="url(#colmo)"/>
    <use href="#nos" y="34"/><use href="#nos" y="78"/><use href="#nos" y="122"/>
  </g>
  <!-- colmo direito -->
  <g transform="translate(164 92) rotate(8)">
    <rect x="-15" y="0" width="30" height="150" rx="13" fill="url(#colmo)"/>
    <use href="#nos" y="30"/><use href="#nos" y="74"/><use href="#nos" y="118"/>
  </g>
  <!-- colmo do meio -->
  <g transform="translate(128 62)">
    <rect x="-16" y="0" width="32" height="182" rx="14" fill="url(#colmo)"/>
    <use href="#nos" y="40"/><use href="#nos" y="88"/><use href="#nos" y="136"/>
  </g>

  <!-- folhas da frente -->
  <path d="M126 66 C 110 30, 84 12, 50 8 C 82 20, 104 40, 116 72 Z" fill="url(#folha)"/>
  <path d="M130 66 C 146 32, 172 14, 208 12 C 176 24, 152 44, 140 72 Z" fill="url(#folha2)"/>
  <path d="M128 64 C 126 40, 130 20, 140 2 C 138 24, 136 44, 134 66 Z" fill="url(#folha)"/>
  <path d="M94 88 C 74 70, 46 66, 22 76 C 48 74, 70 82, 88 96 Z" fill="url(#folha)"/>
  <path d="M166 94 C 186 76, 214 72, 238 82 C 212 80, 190 88, 172 102 Z" fill="url(#folha2)"/>
</svg>
